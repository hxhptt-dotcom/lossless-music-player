name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK output
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk LosslessMusicPlayer-v1.0.0-android.apk
          ls -lh LosslessMusicPlayer-v1.0.0-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LosslessMusicPlayer-android-apk
          path: LosslessMusicPlayer-v1.0.0-android.apk

      - name: Attach APK to GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: LosslessMusicPlayer-v1.0.0-android.apk
