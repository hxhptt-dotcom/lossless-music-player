name: LosslessMusicPlayer
options:
  bundleIdPrefix: com.lossless
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LosslessMusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: LosslessMusicPlayer
        excludes:
          - "web/**"
          - "Info.plist"
      - path: LosslessMusicPlayer/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lossless.musicplayer
        INFOPLIST_FILE: LosslessMusicPlayer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
